version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - docker info  # verify docker is accessible
  build:
    commands:
      - echo Building, Testing and packaging the application
      - mvn package
  post_build:
    commands:
      - echo Build, testing and packaging completed

artifacts:
  files:
    - target/*.jar
  discard-paths: yes

cache:
  paths:
    - '/root/.m2/**/*'

